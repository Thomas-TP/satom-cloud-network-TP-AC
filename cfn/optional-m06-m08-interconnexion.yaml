AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Modules 6, 7 et 8 (TP-AC) - Transit Gateway tgw-leman, VPN site a site (siege / agence) et Direct Connect Gateway.
  NON DEPLOYE : ec2:CreateTransitGateway, CreateCustomerGateway/VpnGateway/VpnConnection et directconnect:* sont bloques par la SCP.
  Les tunnels IPsec et le BGP sont valides par simulation (strongSwan / FRRouting sur EC2, scripts m07 et m08).
Parameters:
  ProdVpcId: {Type: 'AWS::EC2::VPC::Id'}
  ProdAttachSubnetId: {Type: 'AWS::EC2::Subnet::Id', Description: sub-prive-1a-TP-AC}
  DevVpcId: {Type: 'AWS::EC2::VPC::Id'}
  DevAttachSubnetId: {Type: 'AWS::EC2::Subnet::Id', Description: sub-dev-1a-TP-AC}
  ProdRouteTableId: {Type: String, Description: rt-prive-leman-TP-AC}
  DevRouteTableId: {Type: String, Description: rt-dev-leman-TP-AC}
  SiegePublicIp: {Type: String, Default: 203.0.113.10}
  AgencePublicIp: {Type: String, Default: 198.51.100.20}
Resources:
  Tgw:
    Type: AWS::EC2::TransitGateway
    Properties:
      Description: tgw-leman TP-AC
      AmazonSideAsn: 64512
      DefaultRouteTableAssociation: disable
      DefaultRouteTablePropagation: disable
      VpnEcmpSupport: enable
      DnsSupport: enable
      Tags: [{Key: Name, Value: tgw-leman-TP-AC}]
  AttachProd:
    Type: AWS::EC2::TransitGatewayVpcAttachment
    Properties: {TransitGatewayId: !Ref Tgw, VpcId: !Ref ProdVpcId, SubnetIds: [!Ref ProdAttachSubnetId], Tags: [{Key: Name, Value: tgwa-prod-TP-AC}]}
  AttachDev:
    Type: AWS::EC2::TransitGatewayVpcAttachment
    Properties: {TransitGatewayId: !Ref Tgw, VpcId: !Ref DevVpcId, SubnetIds: [!Ref DevAttachSubnetId], Tags: [{Key: Name, Value: tgwa-dev-TP-AC}]}
  TgwRtProd:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties: {TransitGatewayId: !Ref Tgw, Tags: [{Key: Name, Value: tgw-rt-prod-TP-AC}]}
  TgwRtDev:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties: {TransitGatewayId: !Ref Tgw, Tags: [{Key: Name, Value: tgw-rt-dev-TP-AC}]}
  AssocProd:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties: {TransitGatewayRouteTableId: !Ref TgwRtProd, TransitGatewayAttachmentId: !Ref AttachProd}
  AssocDev:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties: {TransitGatewayRouteTableId: !Ref TgwRtDev, TransitGatewayAttachmentId: !Ref AttachDev}
  PropDevToProd:
    Type: AWS::EC2::TransitGatewayRouteTablePropagation
    Properties: {TransitGatewayRouteTableId: !Ref TgwRtProd, TransitGatewayAttachmentId: !Ref AttachDev}
  PropProdToDev:
    Type: AWS::EC2::TransitGatewayRouteTablePropagation
    Properties: {TransitGatewayRouteTableId: !Ref TgwRtDev, TransitGatewayAttachmentId: !Ref AttachProd}
  RouteProdToDev:
    Type: AWS::EC2::Route
    DependsOn: AttachProd
    Properties: {RouteTableId: !Ref ProdRouteTableId, DestinationCidrBlock: 10.21.0.0/24, TransitGatewayId: !Ref Tgw}
  RouteDevToProd:
    Type: AWS::EC2::Route
    DependsOn: AttachDev
    Properties: {RouteTableId: !Ref DevRouteTableId, DestinationCidrBlock: 10.20.0.0/22, TransitGatewayId: !Ref Tgw}
  CgwSiege:
    Type: AWS::EC2::CustomerGateway
    Properties: {Type: ipsec.1, BgpAsn: 65010, IpAddress: !Ref SiegePublicIp, Tags: [{Key: Name, Value: cgw-siege-TP-AC}]}
  CgwAgence:
    Type: AWS::EC2::CustomerGateway
    Properties: {Type: ipsec.1, BgpAsn: 65020, IpAddress: !Ref AgencePublicIp, Tags: [{Key: Name, Value: cgw-agence-TP-AC}]}
  VpnSiege:
    Type: AWS::EC2::VPNConnection
    Properties:
      Type: ipsec.1
      CustomerGatewayId: !Ref CgwSiege
      TransitGatewayId: !Ref Tgw
      StaticRoutesOnly: false
      Tags: [{Key: Name, Value: vpn-siege-TP-AC}]
  VpnAgence:
    Type: AWS::EC2::VPNConnection
    Properties:
      Type: ipsec.1
      CustomerGatewayId: !Ref CgwAgence
      TransitGatewayId: !Ref Tgw
      StaticRoutesOnly: false
      Tags: [{Key: Name, Value: vpn-agence-TP-AC}]
  # La Direct Connect Gateway n'a pas de type CloudFormation : creation par CLI (module 8)
  #   aws directconnect create-direct-connect-gateway --direct-connect-gateway-name dxgw-leman-TP-AC --amazon-side-asn 64513
  #   aws directconnect create-direct-connect-gateway-association --direct-connect-gateway-id <id> --gateway-id <tgw-id> \
  #       --add-allowed-prefixes-to-direct-connect-gateway cidr=10.20.0.0/22 cidr=192.168.10.0/24
Outputs:
  TgwId: {Value: !Ref Tgw}
